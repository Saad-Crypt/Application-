<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d35"><title>الورد الفردي</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#173b32;--muted:#718078;--gold:#c49a45;--line:#e5eae3;--green:#1d5949}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#e4eee5,var(--bg) 48%);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Tahoma",serif;padding:16px 12px 36px}
.wrap{max-width:780px;margin:auto}.hero{text-align:center;padding:20px 14px;background:linear-gradient(135deg,#123d35,#236452);color:#fff;border-radius:24px;box-shadow:0 12px 28px #123d3526}
.app-icon{width:88px;height:88px;object-fit:cover;border:3px solid #e8c879;border-radius:22px;box-shadow:0 5px 16px #0003}.hero h1{font-size:29px;margin:8px 0 2px}.hero p{margin:5px 0 0;color:#d8e8df;font-size:15px}
.summary{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 16px;text-align:center;min-width:112px;box-shadow:0 4px 14px #183b3010}.pill b{display:block;font-size:23px;color:var(--green)}.pill span{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}.tools button,.counter button{border:0;border-radius:12px;padding:9px 14px;background:#e4eee7;color:var(--green);font:inherit;cursor:pointer}.tools button.primary{background:var(--green);color:white}.tools button:active,.counter button:active{transform:scale(.97)}
.list{display:grid;gap:13px}.dhikr{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:0 5px 18px #183b300b}.dhikr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.num{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:#f6edda;color:#936d27;font:bold 15px Tahoma}.dhikr h2{font-size:16px;margin:0;color:var(--muted);font-weight:600}.text{font-size:22px;line-height:2;text-align:center;margin:7px 0 12px;color:var(--ink);white-space:pre-line}
.target{font-size:13px;color:var(--muted);text-align:center;margin:0 0 9px}.progress{height:7px;background:#edf1eb;border-radius:10px;overflow:hidden;margin:0 0 12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#c49a45,#e4c779);width:0%;transition:width .2s}
.counter{display:flex;align-items:center;justify-content:space-between;gap:9px;border-top:1px solid var(--line);padding-top:11px}.count{font:700 25px Tahoma;color:var(--green);min-width:48px;text-align:center}.counter .tap{background:linear-gradient(135deg,#1d5949,#2c7962);color:#fff;font-size:16px;min-width:110px;padding:10px 16px}.counter .reset{font-size:13px;padding:8px 10px}
footer{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 4px}

.daily{background:linear-gradient(145deg,#fffdf7,#f8f2e5);border:1px solid #e7d9b8;border-radius:22px;padding:16px;margin:14px 0 20px;box-shadow:0 7px 20px #5b48200d}
.daily-head{text-align:center}.daily h2{font-size:22px;margin:4px 0;color:#76551c}.daily-meta{color:#74664c;font-size:14px;margin:6px 0 12px}
.daily-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.daily select,.daily a{font:inherit;border:1px solid #d8c89f;border-radius:12px;padding:9px 12px;background:#fff;color:#604719;text-decoration:none}
.daily iframe{width:100%;height:62vh;min-height:420px;border:1px solid #e7dcc2;border-radius:14px;background:#fff}
.daily-note{font-size:12px;color:#80745e;text-align:center;margin:9px 0 0}

@media(max-width:420px){body{padding:10px 8px}.hero h1{font-size:25px}.text{font-size:20px}.dhikr{padding:13px}.counter .tap{min-width:96px;padding:9px}}
</style></head>
<body><main class="wrap">
<header class="hero"><img class="app-icon" src="icon.jpg" alt="أيقونة التطبيق"><h1>الورد الفردي</h1><p>أوراد الذكر والصلاة على سيدنا محمد ﷺ</p></header>
<section class="summary"><div class="pill"><b id="total">0</b><span>مجموع الأذكار</span></div><div class="pill"><b id="done">0</b><span>أوراد اكتملت</span></div><div class="pill"><b>10</b><span>أوراد</span></div></section>
<div class="tools"><button id="smaller" aria-label="تصغير الخط">A−</button><button id="larger" aria-label="تكبير الخط">A+</button><button id="resetAll" class="primary">تصفير الجميع</button></div>

<section class="daily" aria-labelledby="dailyTitle">
  <div class="daily-head">
    <h2 id="dailyTitle">حزب دلائل الخيرات</h2>
    <div class="daily-meta"><strong id="dailyDay">—</strong> · <span id="dailyDate">—</span></div>
    <div class="daily-actions">
      <label for="hizbSelect">اختيار اليوم:</label>
      <select id="hizbSelect" aria-label="اختيار حزب اليوم">
        <option value="1">الاثنين — الحزب الأول</option>
        <option value="2">الثلاثاء — الحزب الثاني</option>
        <option value="3">الأربعاء — الحزب الثالث</option>
        <option value="4">الخميس — الحزب الرابع</option>
        <option value="5">الجمعة — الحزب الخامس</option>
        <option value="6">السبت — الحزب السادس</option>
        <option value="7">الأحد — الحزب السابع</option>
      </select>
      <a id="openHizb" href="https://www.zikralhabeeb.com/dalail/hizb-1/" target="_blank" rel="noopener">فتح الحزب في صفحة مستقلة</a>
    </div>
  </div>
  <iframe id="hizbFrame" title="نص حزب دلائل الخيرات لليوم" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" src="https://www.zikralhabeeb.com/dalail/hizb-1/"></iframe>
  <p class="daily-note">يُحمَّل نص الحزب من مصدره الإلكتروني؛ يلزم اتصال بالإنترنت لعرضه داخل التطبيق.</p>
</section>

<section class="list" id="list"></section><footer>تُحفظ الأعداد تلقائيا على هذا الجهاز</footer></main>
<script>
(()=>{const items=[
["الاستعاذة","أعوذ بالله السميع العليم من الشيطان الرجيم",11],
["سورة الفاتحة","الفاتحة",1],
["آية الإنفاق والاستغفار","وما تقدموا لانفسكم من خير تجدوه عند الله ،هو خيرا وأعظم أجرا ،واستغفروا الله،إن الله غفور رحيم.",1],
["الاستغفار","أستغفر الله العظيم",100],
["يا لطيف بعباده","الله طيف بعباده،يرزق من يشاء،وهو القوي العزيز",1],
["يا لطيف","يا لطيف",645],
["الصلاة النورانية","اللهم صل على سيدنا محمد الذي ملأت قلبه من جلالك وعينه من جمالك فأصبح فرحا مؤيدا منصورا وعلى آله وصحبه، وسلم تسليما والحمد لله على ذلك،",100],
["يا مبدئ","يا مبدئ",120],
["الحفظ والرعاية","بسم الله على نفسي وأهلي ومالي، ولا حول ولا قوة إلا بالله العلي العظيم.",50],
["كلمة التوحيد","لا إله إلا الله",15000]
];
const key='alwird-individual-v2';let counts=items.map(()=>0),font=22;
try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length===items.length)counts=saved.map(x=>Math.max(0,Number(x)||0))}catch(e){}

const hizbDays=[
 {day:'الاثنين',hizb:1,url:'https://www.zikralhabeeb.com/dalail/hizb-1/'},
 {day:'الثلاثاء',hizb:2,url:'https://www.zikralhabeeb.com/dalail/hizb-2/'},
 {day:'الأربعاء',hizb:3,url:'https://www.zikralhabeeb.com/dalail/hizb-3/'},
 {day:'الخميس',hizb:4,url:'https://www.zikralhabeeb.com/dalail/hizb-4/'},
 {day:'الجمعة',hizb:5,url:'https://www.zikralhabeeb.com/dalail/hizb-5/'},
 {day:'السبت',hizb:6,url:'https://www.zikralhabeeb.com/dalail/hizb-6/'},
 {day:'الأحد',hizb:7,url:'https://www.zikralhabeeb.com/dalail/hizb-7/'}
];
const hizbSelect=document.getElementById('hizbSelect');
const hizbFrame=document.getElementById('hizbFrame');
const openHizb=document.getElementById('openHizb');
function showHizb(number){
 const item=hizbDays.find(x=>x.hizb===Number(number))||hizbDays[0];
 document.getElementById('dailyDay').textContent=item.day+' — الحزب '+['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع'][item.hizb-1];
 hizbFrame.src=item.url;openHizb.href=item.url;hizbSelect.value=String(item.hizb);
}
function updateToday(){
 const now=new Date(), map=[6,0,1,2,3,4,5], item=hizbDays[map[now.getDay()]];
 document.getElementById('dailyDate').textContent=new Intl.DateTimeFormat('ar-MA',{year:'numeric',month:'long',day:'numeric'}).format(now);
 showHizb(item.hizb);
}
hizbSelect.addEventListener('change',()=>showHizb(hizbSelect.value));
updateToday();

const list=document.getElementById('list');
items.forEach((it,i)=>{const card=document.createElement('article');card.className='dhikr';card.innerHTML='<div class="dhikr-top"><span class="num">'+(i+1)+'</span><h2></h2></div><div class="text"></div><p class="target"></p><div class="progress"><span></span></div><div class="counter"><button class="reset">إعادة</button><span class="count">0</span><button class="tap">ذكر +</button></div>';card.querySelector('h2').textContent=it[0];card.querySelector('.text').textContent=it[1];card.querySelector('.target').textContent='العدد المطلوب: '+it[2].toLocaleString('en-US');card.querySelector('.tap').addEventListener('click',()=>{counts[i]=Math.min(it[2],counts[i]+1);save();if(navigator.vibrate)navigator.vibrate(10)});card.querySelector('.reset').addEventListener('click',()=>{counts[i]=0;save()});list.appendChild(card)});
const cards=[...document.querySelectorAll('.dhikr')];
function save(){try{localStorage.setItem(key,JSON.stringify(counts))}catch(e){}render()}
function render(){let total=0,done=0;cards.forEach((card,i)=>{total+=counts[i];if(counts[i]>=items[i][2])done++;card.querySelector('.count').textContent=counts[i].toLocaleString('en-US');card.querySelector('.progress span').style.width=Math.min(100,counts[i]/items[i][2]*100)+'%';card.querySelector('.tap').disabled=counts[i]>=items[i][2];card.querySelector('.tap').textContent=counts[i]>=items[i][2]?'اكتمل ✓':'ذكر +' });document.getElementById('total').textContent=total.toLocaleString('en-US');document.getElementById('done').textContent=done}
document.getElementById('resetAll').addEventListener('click',()=>{if(confirm('هل تريد تصفير جميع الأوراد؟')){counts=items.map(()=>0);save()}});
document.getElementById('larger').addEventListener('click',()=>{font=Math.min(36,font+2);document.querySelectorAll('.text').forEach(x=>x.style.fontSize=font+'px')});
document.getElementById('smaller').addEventListener('click',()=>{font=Math.max(16,font-2);document.querySelectorAll('.text').forEach(x=>x.style.fontSize=font+'px')});
render();
})();
</script></body></html>
